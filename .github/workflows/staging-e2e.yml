name: Staging real journey gate

on:
  deployment_status:
  workflow_run:
    workflows: ['Verify and deploy API']
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA deployed to both staging services
        required: true

permissions:
  contents: read

concurrency:
  group: staging-real-journeys
  cancel-in-progress: false

jobs:
  journeys:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging') ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'staging' || github.event.deployment.environment == 'Preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Staging E2E
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_API_URL: ${{ vars.E2E_API_URL }}
      E2E_EXPECTED_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.event.deployment.sha }}
      E2E_RUN_ID: E2E-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ARTIFACT_DIR: test-results/staging-evidence
      E2E_AUTH_STATE_PATH: /tmp/kanvise-${{ github.run_id }}-${{ github.run_attempt }}-admin-state.json
      E2E_STUDENT_STATE_PATH: /tmp/kanvise-${{ github.run_id }}-${{ github.run_attempt }}-student-state.json
      E2E_TUTOR_STATE_PATH: /tmp/kanvise-${{ github.run_id }}-${{ github.run_attempt }}-tutor-state.json
      E2E_ALLOWED_SUPABASE_HOST: ${{ vars.E2E_ALLOWED_SUPABASE_HOST }}
      E2E_ALLOWED_R2_BUCKET: ${{ vars.E2E_ALLOWED_R2_BUCKET }}
      E2E_GMAIL_CLIENT_ID: ${{ secrets.E2E_GMAIL_CLIENT_ID }}
      E2E_GMAIL_CLIENT_SECRET: ${{ secrets.E2E_GMAIL_CLIENT_SECRET }}
      E2E_GMAIL_REFRESH_TOKEN: ${{ secrets.E2E_GMAIL_REFRESH_TOKEN }}
      E2E_GMAIL_ADDRESS: ${{ vars.E2E_GMAIL_ADDRESS }}
      E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.E2E_EXPECTED_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Test staging cleanup safety
        run: node --test scripts/staging-e2e-safety.test.mjs scripts/staging-certification-lib.test.mjs
      - name: Test staging browser harness
        working-directory: web
        run: npx vitest run --config=vitest.staging.config.ts
      - name: Require all real-provider configuration
        run: node scripts/validate-staging-e2e-env.mjs
      - name: Wait for matching web and API deployments
        run: node scripts/wait-for-staging-release.mjs
      - name: Verify real provider access
        run: node scripts/staging-e2e-preflight.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run real staging journeys
        working-directory: web
        run: npx playwright test --config=playwright.staging.config.ts
      - name: Reject flaky certification
        if: always()
        run: node scripts/reject-flaky-playwright-report.mjs web/test-results/staging-report.json
      - name: Clean current run resources
        if: always()
        run: node scripts/staging-e2e-cleanup.mjs "web/test-results/staging-evidence/${E2E_RUN_ID}.manifest.json" --execute
      - name: Validate complete release certification
        if: always()
        run: node scripts/validate-staging-certification.mjs web/test-results/staging-report.json "web/test-results/staging-evidence/${E2E_RUN_ID}.manifest.json"
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-${{ env.E2E_RUN_ID }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            web/test-results/
            web/playwright-report/
            web/test-results/staging-evidence/
