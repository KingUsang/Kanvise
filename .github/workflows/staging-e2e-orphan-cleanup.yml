name: Clean abandoned staging E2E runs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-real-journeys
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Staging E2E
    env:
      E2E_RUN_ID: E2E-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_API_URL: ${{ vars.E2E_API_URL }}
      E2E_ALLOWED_SUPABASE_HOST: ${{ vars.E2E_ALLOWED_SUPABASE_HOST }}
      E2E_ALLOWED_R2_BUCKET: ${{ vars.E2E_ALLOWED_R2_BUCKET }}
      E2E_ORPHAN_MANIFEST_DIR: test-results/staging-orphans
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Discover, verify, and clean abandoned runs
        run: node scripts/staging-e2e-orphan-cleanup.mjs --execute
      - name: Upload cleanup audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-orphan-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: test-results/staging-orphans/
