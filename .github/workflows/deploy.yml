name: Verify and deploy API

on:
  push:
    branches: [main, staging]
    paths:
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/migrations/**'
      - 'scripts/operations/deploy-api-on-oracle.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: api-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build API
    # Manual dispatch on any other ref must not build, migrate or deploy
    # (DEV-OPS-016). Every later job depends on this one.
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace=api
      - run: npm run build --workspace=api
      - name: Upload compiled API
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api/dist
          if-no-files-found: error

  changes:
    name: Detect database changes
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'

  migrations:
    name: Apply database migrations
    needs: [verify, changes, certification]
    # Production must reconcile its full ordered migration history on every
    # deploy. A prior code-only deploy can otherwise leave production running
    # code that references a migration applied only in staging. Staging still
    # runs migrations when a migration file changes.
    if: github.ref_name == 'main' || needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Preview is Kanvise's staging environment; Production is protected in
    # GitHub and requires its configured reviewer approval before this runs.
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    concurrency:
      group: supabase-migrations-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.20.3
      - name: Report remote schema (read-only)
        # Diagnostic for staging schema drift. Prints catalog metadata only,
        # never row data, inside a read-only transaction that is rolled back.
        if: github.ref_name != 'main'
        continue-on-error: true
        run: |
          test -n "$SUPABASE_DB_URL"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql "$SUPABASE_DB_URL" --no-psqlrc --quiet --pset=pager=off <<'SQL'
          \set ON_ERROR_STOP off
          \set ON_ERROR_ROLLBACK on
          BEGIN READ ONLY;

          \echo '== Migration history from 20260706 =='
          SELECT version, name
          FROM supabase_migrations.schema_migrations
          WHERE version >= '20260706'
          ORDER BY version;

          \echo '== Functions in schema public =='
          SELECT p.proname AS name,
                 pg_get_function_identity_arguments(p.oid) AS args,
                 p.prosecdef AS security_definer,
                 p.proconfig AS config
          FROM pg_proc p
          JOIN pg_namespace n ON n.oid = p.pronamespace
          WHERE n.nspname = 'public'
            AND NOT EXISTS (
              SELECT 1 FROM pg_depend d
              WHERE d.classid = 'pg_proc'::regclass
                AND d.objid = p.oid
                AND d.deptype = 'e'
            )
          ORDER BY p.proname, args;

          \echo '== RLS policies in schema public =='
          SELECT tablename, policyname, cmd, roles, qual, with_check
          FROM pg_policies
          WHERE schemaname = 'public'
          ORDER BY tablename, policyname;

          \echo '== Constraints on key tables =='
          SELECT c.relname AS tablename,
                 con.conname,
                 con.contype,
                 pg_get_constraintdef(con.oid) AS definition
          FROM pg_constraint con
          JOIN pg_class c ON c.oid = con.conrelid
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relname IN (
              'avatar_configs', 'user_profiles', 'schools', 'enrolments',
              'payments', 'submissions', 'live_classes', 'courses',
              'programmes', 'assignments', 'notes'
            )
          ORDER BY c.relname, con.conname;

          \echo '== RLS enabled per public table =='
          SELECT c.relname AS tablename,
                 c.relrowsecurity AS rls_enabled,
                 c.relforcerowsecurity AS rls_forced
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relkind IN ('r', 'p')
          ORDER BY c.relname;

          \echo '== Table grants to anon and authenticated =='
          SELECT table_name, grantee,
                 string_agg(privilege_type, ', ' ORDER BY privilege_type) AS privileges
          FROM information_schema.role_table_grants
          WHERE table_schema = 'public'
            AND grantee IN ('anon', 'authenticated')
          GROUP BY table_name, grantee
          ORDER BY table_name, grantee;

          ROLLBACK;
          SQL
      - name: Check pending migration plan
        run: |
          test -n "$SUPABASE_DB_URL"
          # Preview can legitimately lag behind the shared migration history
          # after a feature branch is promoted. Include those ordered, missing
          # migrations there; keep production's ordering check strict.
          supabase db push --dry-run --include-all --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        run: |
          supabase db push --include-all --db-url "$SUPABASE_DB_URL"
      - name: Record remote migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

  certification:
    name: Require certified staging commit
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find a successful real-journey gate for this exact commit
        if: github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = 'staging-e2e.yml'
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow,
              head_sha: context.sha,
              status: 'completed',
              per_page: 100,
            })
            for (const run of runs) {
              if (run.conclusion !== 'success') continue
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              })
              const gate = jobs.find(job => job.name === 'journeys' && job.conclusion === 'success')
              if (gate) {
                core.info(`Commit ${context.sha} was certified by ${run.html_url}`)
                return
              }
            }
            core.setFailed(`Commit ${context.sha} has no successful Staging real journey gate. Promote staging to main without rewriting the certified SHA.`)

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: [verify, migrations, certification]
    # A skipped migration job means this commit has no database change; it must
    # not prevent a normal API-only deployment.
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.certification.result == 'success' || needs.certification.result == 'skipped') &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped')
    runs-on: [self-hosted, Linux, ARM64, oracle, kanvise-api]
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled API
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: ${{ runner.temp }}/kanvise-api-${{ github.sha }}
      - name: Deploy verified API artifact locally on Oracle
        env:
          DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          DEPLOY_ARTIFACT_DIR: ${{ runner.temp }}/kanvise-api-${{ github.sha }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/operations/deploy-api-on-oracle.sh

      - name: Verify deployed API health
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          test -n "$API_HEALTH_URL"
          curl --fail --show-error --silent --retry 5 --retry-delay 5 "$API_HEALTH_URL/health" \
            | node -e '
                let body = "";
                process.stdin.on("data", chunk => { body += chunk });
                process.stdin.on("end", () => {
                  const health = JSON.parse(body);
                  if (health.status !== "ok" || health.release_sha !== process.env.EXPECTED_RELEASE_SHA || health.environment !== process.env.EXPECTED_ENVIRONMENT) process.exit(1);
                });
              '
