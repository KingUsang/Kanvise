name: Verify and deploy API

on:
  push:
    branches: [main, staging]
    paths:
      - 'api/**'
      - 'supabase/migrations/**'
      - 'scripts/operations/deploy-api-on-oracle.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace=api
      - run: npm run build --workspace=api
      - name: Upload compiled API
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api/dist
          if-no-files-found: error

  changes:
    name: Detect database changes
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'

  migrations:
    name: Apply database migrations
    needs: [verify, changes]
    # Production must reconcile its full ordered migration history on every
    # deploy. A prior code-only deploy can otherwise leave production running
    # code that references a migration applied only in staging. Staging still
    # runs migrations when a migration file changes.
    if: github.ref_name == 'main' || needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Preview is Kanvise's staging environment; Production is protected in
    # GitHub and requires its configured reviewer approval before this runs.
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    concurrency:
      group: supabase-migrations-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Check pending migration plan
        run: |
          test -n "$SUPABASE_DB_URL"
          # Preview can legitimately lag behind the shared migration history
          # after a feature branch is promoted. Include those ordered, missing
          # migrations there; keep production's ordering check strict.
          supabase db push --dry-run --include-all --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        run: |
          supabase db push --include-all --db-url "$SUPABASE_DB_URL"
      - name: Record remote migration history
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: [verify, migrations]
    # A skipped migration job means this commit has no database change; it must
    # not prevent a normal API-only deployment.
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped')
    runs-on: [self-hosted, Linux, ARM64, oracle, kanvise-api]
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled API
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: ${{ runner.temp }}/kanvise-api-${{ github.sha }}
      - name: Deploy verified API artifact locally on Oracle
        env:
          DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          DEPLOY_ARTIFACT_DIR: ${{ runner.temp }}/kanvise-api-${{ github.sha }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/operations/deploy-api-on-oracle.sh

      - name: Verify deployed API health
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          test -n "$API_HEALTH_URL"
          curl --fail --show-error --silent --retry 5 --retry-delay 5 "$API_HEALTH_URL/health" \
            | node -e '
                let body = "";
                process.stdin.on("data", chunk => { body += chunk });
                process.stdin.on("end", () => {
                  const health = JSON.parse(body);
                  if (health.status !== "ok" || health.release_sha !== process.env.EXPECTED_RELEASE_SHA || health.environment !== process.env.EXPECTED_ENVIRONMENT) process.exit(1);
                });
              '
